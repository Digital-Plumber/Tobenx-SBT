name: CI Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"
      - "main"
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  create-or-update-pr:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feat/'))
    name: Create or update PR
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine branch name
        id: vars
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create or update PR via GitHub API
        id: create_pr
        uses: actions/github-script@v7
        env:
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.branch || process.env.GITHUB_REF_NAME || (context.payload.ref || '').replace('refs/heads/', '');
            if (!branch) return core.setFailed('Unable to determine branch name');

            // prefer a repo PAT (PR_TOKEN) when available so the created PR triggers workflows
            const token = process.env.PR_TOKEN || process.env.GITHUB_TOKEN;
            const myOctokit = github.getOctokit(token);

            // look for existing PR to main
            const pulls = await myOctokit.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base: 'main' });
            if (pulls.data && pulls.data.length > 0) {
              core.info(`PR already exists: #${pulls.data[0].number}`);
              core.setOutput('pr_number', String(pulls.data[0].number));
              return;
            }

            const title = `feat: ${branch}`;
            const body = `## Summary\n\n- Automated PR from branch ${branch}\n- CI validation to run before merge\n- Auto-merge enabled after successful checks\n`;
            const pr = await myOctokit.rest.pulls.create({ owner, repo, title, head: branch, base: 'main', body });
            core.setOutput('pr_number', String(pr.data.number));
            core.info(`Created PR #${pr.data.number}`);

            try {
              await myOctokit.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/auto-merge', {
                owner,
                repo,
                pull_number: pr.data.number,
                merge_method: 'merge'
              });
              core.info('Enabled auto-merge for PR #' + pr.data.number);
            } catch (err) {
              core.warning('Could not enable auto-merge: ' + err.message);
            }
            // expose pr_number as step output
            core.setOutput('pr_number', pr.data ? String(pr.data.number) : '');

  validation:
    if: |
      github.event_name == 'pull_request' || (
        github.event_name == 'push' && (
          startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feat/')
        )
      )
    name: Validate PR (tests, lint, dry-run release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run tests
        run: npm test

      - name: Validate versioning (semantic-release dry-run)
        run: npx semantic-release --dry-run --no-ci

  auto-merge:
    needs: validation
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    name: Enable auto-merge after successful checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return core.setFailed('No PR in context');
            try {
              await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/auto-merge', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'merge'
              });
              core.info('Auto-merge enabled for PR #' + pr.number);
            } catch (err) {
              core.warning('Failed to enable auto-merge: ' + err.message);
            }

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    name: Release on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
