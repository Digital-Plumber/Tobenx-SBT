name: "Production Release"

on:
  # Primary trigger: fires after CI completes on main.
  # This bypasses GitHub's GITHUB_TOKEN workflow-suppression rule —
  # when auto-merge uses GITHUB_TOKEN the resulting push may not
  # re-trigger push-based workflows, but workflow_run always fires.
  workflow_run:
    workflows: ["Continuous Integration & Delivery"]
    types: [completed]
    branches: [main]

  # Fallback: direct push to main (e.g. manual hotfixes)
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  release:
    # For workflow_run: only proceed when CI passed
    # For push:        always proceed (independent hotfix path)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Semantic versioning and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run lint && npm test

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
        run: npx semantic-release
